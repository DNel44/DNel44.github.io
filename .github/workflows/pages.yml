name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare site files with API key
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "::error::Add the YOUTUBE_API_KEY repository secret before deploying."
            exit 1
          fi

          mkdir -p _site
          cp index.html quizz_classic.html quizz_easy.html quiz.js style.css _site/
          if [[ ! "$YOUTUBE_API_KEY" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::YOUTUBE_API_KEY contains unexpected characters."
            exit 1
          fi

          python3 - <<'PY'
          import os
          from pathlib import Path

          key = os.environ["YOUTUBE_API_KEY"]
          for name in ("quizz_classic.html", "quizz_easy.html"):
              page = Path("_site") / name
              content = page.read_text()
              if content.count("__YOUTUBE_API_KEY__") != 1:
                  raise SystemExit(f"Expected one API key placeholder in {name}.")
              page.write_text(content.replace("__YOUTUBE_API_KEY__", key))
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
