<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Guess the song </title>
</head>
  <h1>Guess the Song</h1>

  <p>Question <span id="question-number">1</span></p>
  <p>Score: <span id="score">0</span></p>
  <p>Current streak: <span id="streak">0</span></p>

  <h2>Listen to the clip</h2>
  <audio id="song-audio" controls></audio>

  <h2>What song is this?</h2>
  <form id="answer-form">
    <label for="song-title">Song title</label>
    <input id="song-title" type="text">

    <label for="artist-name">Artist name</label>
    <input id="artist-name" type="text">

    <button type="submit">Submit answer</button>
  </form>

  <p id="feedback" aria-live="polite"></p>

  <button id="skip-button" type="button">Skip this song</button>
</body>
</html>
