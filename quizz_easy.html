<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="quiz.js" defer></script>
  <title>Guess the Song — Easy Mode</title>
</head>
<body data-mode="easy">
  <header class="quiz-header">
    <a class="menu-button" href="index.html">Menu</a>
  </header>

  <main class="quiz-main">
    <h1>Guess the Song — Easy Mode</h1>
    <p id="playlist-info"></p>
    <p id="audio-status" role="status"></p>

    <section aria-label="Quiz score">
      <p>Question <span id="question-number">1</span> of <span id="question-total">4</span></p>
      <p>Score: <span id="score">0</span></p>
      <p>Current streak: <span id="streak">0</span></p>
    </section>

    <p id="completion" aria-live="polite" hidden></p>

    <section id="question-panel">
      <section class="audio-card" aria-label="Audio player">
        <div class="audio-card-heading">
          <div class="audio-art" aria-hidden="true">♫</div>
          <div>
            <p class="audio-eyebrow">EASY MODE · 7 SECOND CLIP</p>
            <h2>Listen to the clip</h2>
            <p class="audio-caption">Choose the song and artist you hear.</p>
          </div>
        </div>
        <div class="audio-wave" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <audio id="song-audio" controls aria-label="Song clip"></audio>
      </section>

      <form id="answer-form">
        <fieldset>
          <legend>Choose the song and artist</legend>
          <div id="answer-options"></div>
        </fieldset>
        <div class="answer-submit-row">
          <button type="submit">Submit answer</button>
          <button id="skip-button" type="button">Skip question</button>
        </div>
      </form>

      <p id="feedback" aria-live="polite"></p>
      <button id="next-button" type="button" hidden>Next question</button>
    </section>
  </main>
</body>
</html>
