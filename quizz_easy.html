<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="youtube-config.js"></script>
  <script src="quiz.js" defer></script>
  <title>Guess the Song — Easy Mode</title>
</head>
<body data-mode="easy">
  <header class="quiz-header">
    <a class="menu-button" href="index.html">Menu</a>
  </header>

  <main>
    <h1>Guess the Song — Easy Mode</h1>
    <p id="playlist-info"></p>
    <p id="audio-status" role="status"></p>

    <section aria-label="Quiz score">
      <p>Question <span id="question-number">—</span> of <span id="question-total">—</span></p>
      <p>Score: <span id="score">0</span></p>
      <p>Current streak: <span id="streak">0</span></p>
    </section>

    <p id="completion" aria-live="polite" hidden></p>

    <section id="question-panel">
      <section class="audio-card" aria-label="YouTube video player">
        <div class="audio-card-heading">
          <div class="audio-art" aria-hidden="true">▶</div>
          <div>
            <p class="audio-eyebrow">EASY MODE · 7 SECOND CLIP</p>
            <h2>Watch the clip</h2>
            <p class="audio-caption">Hear a randomly selected 7-second segment, then choose the matching song and artist.</p>
          </div>
        </div>
        <div id="youtube-player" class="youtube-player-frame"></div>
        <div class="player-controls">
          <button id="play-clip-button" type="button" disabled>Play random 7-second clip</button>
          <button id="pause-clip-button" type="button" disabled>Pause clip</button>
          <p id="player-status" role="status" aria-live="polite">Preparing YouTube player...</p>
        </div>
        <div class="youtube-player-link">
          <a id="playlist-link" href="https://www.youtube.com" target="_blank" rel="noopener noreferrer">
            Open current video on YouTube
          </a>
        </div>
      </section>

      <form id="answer-form">
        <fieldset>
          <legend>Choose the song and artist</legend>
          <div id="answer-options"></div>
        </fieldset>
        <div class="answer-submit-row">
          <button type="submit">Submit answer</button>
          <button id="skip-button" type="button">Skip question</button>
        </div>
      </form>

      <p id="feedback" aria-live="polite"></p>
      <button id="next-button" type="button" hidden>Next question</button>
    </section>
  </main>
</body>
</html>
